name: Build Windows Desktop (.exe) — Studio & Y Dược

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "desktop/**"
      - "engine/**"
      - "assets/**"
      - "*.html"
      - "config.js"
      - ".github/workflows/package-win.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node -e "const fs=require('fs'),cp=require('child_process'); if(!fs.existsSync('node_modules/electron/dist/electron.exe')) cp.execFileSync('node',['node_modules/electron/install.js'],{stdio:'inherit'});"

      - name: Run unit & HTTP seam tests
        working-directory: desktop
        run: npm test

      - name: Smoke test local AI CLI server
        working-directory: desktop
        shell: pwsh
        run: |
          node -e "import('./server/drivers.mjs').then(m => m.listEngines()).then(r => console.log('DRIVERS_OK', r.length))"
          $p = Start-Process -FilePath "node" -ArgumentList "server/index.mjs" -Environment @{ PORT = "47123"; HOST = "127.0.0.1" } -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try {
            $h = Invoke-RestMethod "http://127.0.0.1:47123/api/health"
            if (-not $h.ok) { throw "Health check failed" }
            Write-Host "SERVER_OK" $h.version
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows NSIS Installer & Portable EXE
        working-directory: desktop
        run: npm run build:win -- --publish never

      - name: Build Windows Y Dược edition (NSIS Installer & Portable EXE)
        working-directory: desktop
        run: npm run build:win:yduoc -- --publish never

      - name: List generated artifacts
        shell: pwsh
        run: |
          Get-ChildItem "desktop\release\*" | Select-Object Name, Length
          Get-ChildItem "desktop\release-yduoc\*" | Select-Object Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-layout-vi-windows-exe
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
            desktop/release-yduoc/*.exe

      - name: Publish Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
            desktop/release-yduoc/*.exe
            desktop/release-yduoc/*.exe.blockmap
