appId: com.huynhanhthuan.pdflayoutvi
productName: PDF Layout VI Studio
copyright: Copyright © 2026 Huynh Anh Thuan
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - package.json
  - "!release/**"
  - "!release-yduoc/**"
  - "!node_modules/.cache/**"
extraResources:
  - from: server
    to: server
  - from: app
    to: app
  - from: ../engine
    to: engine
  - from: editions/standard.json
    to: edition.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: PDF-Layout-VI-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PDF Layout VI Studio
  uninstallDisplayName: PDF Layout VI Studio
portable:
  artifactName: PDF-Layout-VI-${version}-${arch}-portable.${ext}
publish:
  provider: github
  owner: thuanhuynh247
  repo: pdf-layout-vi
